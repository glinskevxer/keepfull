name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a second push while the first is still going makes the first one pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # every job needs these two or the settings parser refuses to boot
  YARD_LATITUDE: '42.4432'
  YARD_LONGITUDE: '-76.5019'

jobs:
  checks:
    name: lint, types and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: types
        run: npm run typecheck
      - name: formatting
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts" "scripts/**/*.ts"
      - name: the command reference matches the cli
        run: npm run commands:check

  test:
    name: tests on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.1', '22.13.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: tests
        run: npm test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
      - run: npm ci
      - name: coverage
        run: npm run coverage
      - name: keep the report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: what git would ship
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
      - run: npm ci
      - name: export check
        run: npm run export-check
      - name: release check
        run: npm run release-check

  image:
    name: the container builds and comes up healthy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: |
          docker build \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t keepfull:ci .
      - name: start it
        run: |
          docker run -d --name keepfull-ci -p 8080:8080 \
            -e YARD_LATITUDE=42.4432 -e YARD_LONGITUDE=-76.5019 \
            -e API_KEYS=ci:admin:ci-key-that-is-long-enough-here \
            keepfull:ci
      - name: wait for it to say it is ready
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ready > /dev/null; then
              echo "ready after $attempt attempts"
              exit 0
            fi
            sleep 2
          done
          echo "never came up" >&2
          docker logs keepfull-ci >&2
          exit 1
      - name: the health probe inside the container agrees
        run: docker exec keepfull-ci node dist/health-probe.js
      - name: it knows what it is running
        run: |
          curl -fsS http://127.0.0.1:8080/ | tee /dev/stderr | grep -q '"commit":"'
      - name: stop it
        if: always()
        run: docker rm -f keepfull-ci || true

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
      - run: npm ci
      - name: read the advisories against what ships
        run: npm audit --omit=dev --json > audit.json || true
      - name: decide about them
        run: npx tsx scripts/audit-dependencies.ts --from-audit audit.json
      - name: read the advisories against the toolchain, for information
        run: npm audit --json > audit-dev.json || true
      - name: print them
        run: npx tsx scripts/audit-dependencies.ts --from-audit audit-dev.json --report-only
