name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a second push while the first is still going makes the first one pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint, types and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: types
        run: npm run typecheck
      - name: formatting
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts"

  test:
    name: tests on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.1', '22.13.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: tests
        run: npm test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
      - run: npm ci
      - name: coverage
        run: npm run coverage
      - name: keep the report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
